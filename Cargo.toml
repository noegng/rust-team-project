[workspace]
resolver = "3"
members = ["crates/blockchain", "crates/client", "crates/node"]

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
tokio-tungstenite = "0.30.0"
